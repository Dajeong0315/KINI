name: kini-cache
services:
  redis:
    image: redis:8.2-alpine@sha256:da23c2478319ceb4903857d77a2fd7aa5137d9e9d4c8165dafbacedac6403e95
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--maxmemory", "32mb", "--maxmemory-policy", "allkeys-lfu", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5
    restart: "no"
