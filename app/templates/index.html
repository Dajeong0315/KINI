<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f7ef" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}" />
    <title>KINI · 우리 가족의 영양사</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='scenario.css') }}" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">본문으로 건너뛰기</a>
    <div class="app-shell" id="app-shell" data-device="{{ device_mode|default('auto') }}">
      <header class="topbar">
        <a class="wordmark" href="#home" data-view-link="home" aria-label="KINI 홈">
          <span class="wordmark-mark" aria-hidden="true"></span><span>KINI</span>
        </a>
        <span class="tagline">우리 가족의 영양사</span>
        <div class="header-actions">
          <span id="dataset-badge" class="badge" hidden>예시 데이터</span>
          <button type="button" id="household-settings" class="outline" data-view-link="profile">
            <span class="ui-icon icon-family" aria-hidden="true"></span>가족 관리
          </button>
          <div class="device-switcher" id="device-switcher" role="group" aria-label="화면 버전">
            <button type="button" class="filter" data-device-choice="fridge" aria-pressed="false">냉장고 버전</button>
            <button type="button" class="filter" data-device-choice="mobile" aria-pressed="false">앱 버전</button>
          </div>
        </div>
      </header>
      <div class="app-layout">
        <nav class="sidebar" aria-label="주요 메뉴">
          <button class="nav-item active" type="button" data-view-link="home"><span class="ui-icon icon-home" aria-hidden="true"></span>홈</button>
          <button class="nav-item" type="button" data-view-link="inventory"><span class="ui-icon icon-inventory" aria-hidden="true"></span>식재료</button>
          <button class="nav-item" type="button" data-view-link="recommend"><span class="ui-icon icon-menu" aria-hidden="true"></span>메뉴 추천</button>
          <button class="nav-item" type="button" data-view-link="report"><span class="ui-icon icon-chart" aria-hidden="true"></span>영양 관리</button>
        </nav>
        <main class="content" id="main-content" tabindex="-1">
          <section class="view active" data-view="home" data-root-view></section>
          <section class="view" data-view="inventory" data-root-view hidden></section>
          <section class="view" data-view="recommend" data-root-view hidden></section>
          <section class="view" data-view="report" data-root-view hidden></section>
          <section class="view" data-view="profile" data-root-view hidden></section>
          <section class="view" data-view="recipe" data-parent-view="recommend" hidden></section>
          <section class="view" data-view="cook" data-parent-view="recommend" hidden></section>
          <section class="view" data-view="record" data-parent-view="recommend" hidden></section>
        </main>
      </div>
    </div>
    <dialog id="scenario-dialog" aria-labelledby="dialog-title">
      <div class="dialog-heading">
        <h2 id="dialog-title"></h2>
        <button type="button" id="dialog-close" class="icon-button" aria-label="닫기">×</button>
      </div>
      <div id="dialog-body"></div>
      <p id="dialog-error" class="scenario-warning" role="alert" hidden></p>
    </dialog>
    <script src="{{ url_for('static', filename='api_client.js') }}"></script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
